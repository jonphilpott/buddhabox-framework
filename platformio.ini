; BuddhaBox framework — example and test builds.
;
; The library itself lives in src/buddhabox/ and is used by other projects
; through lib_deps (see README.md). This file only builds the examples in
; this repository, each as its own environment:
;
;   pio run                      build every example
;   pio run -e minimal           build one
;   pio run -e minimal -t upload flash it (DFU: hold BOOT0, tap NRST)
;
; HOW THE EXAMPLES FIND THE LIBRARY: src_dir is the library's src/, which
; PlatformIO puts on the include path, so `#include "buddhabox/..."` works.
; Each environment's build_src_filter compiles the library's .cpp files
; plus one example folder.

[platformio]
default_envs = minimal, singing_bowls, drum_machine, custom_voice, compile_all, profile

[common]
platform = ststm32@15.4.1
board = blackpill_f401cc
framework = arduino
upload_protocol = dfu
; The STM32 core adds -Os (optimise for size) after build_flags, and GCC
; obeys the last -O it sees, so -O2 alone is silently ignored. Remove it.
build_unflags = -Os
build_flags =
    -O2
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON

; A single sine tone: the smallest complete program.
[env:minimal]
extends = common
build_src_filter = +<buddhabox/> +<../examples/minimal/>

; Struck and bowed resonances with chaotic modulation and reverb.
[env:singing_bowls]
extends = common
build_src_filter = +<buddhabox/> +<../examples/singing_bowls/>

; Generative 808/909 drum pattern.
[env:drum_machine]
extends = common
build_src_filter = +<buddhabox/> +<../examples/drum_machine/>

; Builds every module at once (not musical): proves they all compile for
; the Cortex-M4 and shows their combined flash and RAM.
[env:compile_all]
extends = common
build_src_filter = +<buddhabox/> +<../examples/compile_all/>

; Composition guide example: a custom voice class and a custom FxEngine
; effect (quoted in docs/index.html).
[env:custom_voice]
extends = common
build_src_filter = +<buddhabox/> +<../examples/custom_voice/>

; CPU profiler: times each module on the board and prints cycles per
; sample over USB serial. Never starts the audio engine, so it reports
; even when a patch would be over budget.
[env:profile]
extends = common
build_src_filter = +<buddhabox/> +<../examples/profile/>
