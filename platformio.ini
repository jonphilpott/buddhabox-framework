; BuddhaBox framework — example and test builds.
;
; The library itself lives in src/buddhabox/ and is used by other projects
; through lib_deps (see README.md). This file only builds the examples in
; this repository, each as its own environment:
;
;   pio run                      build every example
;   pio run -e minimal           build one
;   pio run -e minimal -t upload flash it (DFU: hold BOOT0, tap NRST)
;
; HOW THE EXAMPLES FIND THE LIBRARY: src_dir is the library's src/, which
; PlatformIO puts on the include path, so `#include "buddhabox/..."` works.
; Each environment's build_src_filter compiles the library's .cpp files
; plus one example folder.

[platformio]
default_envs =
    minimal
    singing_bowls
    drum_machine
    custom_voice
    compile_all
    profile
    profile_all
    patch_minimal
    patch_demo
    patch_hardware
    patch_param
    minimal_f401
    oled
    aeolian_harp
    easel

[common]
platform = ststm32@15.4.1
; The WeAct Black Pill V2.0 with an STM32F411CE: 96 MHz, 128 KB RAM,
; 512 KB flash. The older F401CC board (84 MHz, 64 KB RAM) also works:
; set board = blackpill_f401cc, as env:minimal_f401 below does. The
; pinout and the I2S clock are the same on both.
board = blackpill_f411ce
framework = arduino
; Upload with an ST-Link on the SW header (DIO, SCK, GND; 3V3 only if
; USB is unplugged). The ROM DFU bootloader on WeAct F411 boards is
; unreliable; with a board that does take it, use dfu and the BOOT0 dance.
upload_protocol = stlink
; The STM32 core adds -Os (optimise for size) after build_flags, and GCC
; obeys the last -O it sees, so -O2 alone is silently ignored. Remove it.
build_unflags = -Os
build_flags =
    -O2
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON

; A single sine tone: the smallest complete program.
[env:minimal]
extends = common
build_src_filter = +<buddhabox/> +<../examples/minimal/>

; Generative aeolian harp in D: wind-blown strings singing the harmonic
; series of D2 as gusts rise and fall.
[env:aeolian_harp]
extends = common
build_src_filter = +<buddhabox/> +<../examples/aeolian_harp/>

; Buchla Easel-style patch: pulser, 5-step sequencer, FM'd and folded
; complex oscillator (2x oversampled), two LPGs and a spring reverb.
[env:easel]
extends = common
build_src_filter = +<buddhabox/> +<../examples/easel/>

; A knob on PA1 sets the pitch, an encoder (PB6/PB7, push on PB5)
; transposes it; a 128x64 I2C OLED on PB8 (SCL) and PB9
; (SDA) shows it with the CPU load. Plays even with no display attached.
[env:oled]
extends = common
build_src_filter = +<buddhabox/> +<../examples/oled/>

; The same program for the F401CC Black Pill: proves the older board
; still builds.
[env:minimal_f401]
extends = env:minimal
board = blackpill_f401cc

; Struck and bowed resonances with chaotic modulation and reverb.
[env:singing_bowls]
extends = common
build_src_filter = +<buddhabox/> +<../examples/singing_bowls/>

; Generative 808/909 drum pattern.
[env:drum_machine]
extends = common
build_src_filter = +<buddhabox/> +<../examples/drum_machine/>

; Builds every module at once (not musical): proves they all compile for
; the Cortex-M4 and shows their combined flash and RAM.
[env:compile_all]
extends = common
build_src_filter = +<buddhabox/> +<../examples/compile_all/>
; It drives the blue LED with UserLED, so turn off the engine's overrun
; LED (which uses the same pin). Also proves the "off" setting builds.
build_flags = ${common.build_flags} -D BB_OVERRUN_LED=0

; Composition guide example: a custom voice class and a custom FxEngine
; effect (quoted in docs/index.html).
[env:custom_voice]
extends = common
build_src_filter = +<buddhabox/> +<../examples/custom_voice/>

; CPU profiler: times each module on the board and prints cycles per
; sample over USB serial. Never starts the audio engine, so it reports
; even when a patch would be over budget.
[env:profile]
extends = common
build_src_filter = +<buddhabox/> +<../examples/profile/>

; Profiles every audio module and prints CSV (module, header, cycles,
; RAM, share of budget) for tools such as a patch editor to read.
[env:profile_all]
extends = common
build_src_filter = +<buddhabox/> +<../examples/profile_all/>

; examples/minimal rebuilt from patch.json by tools/gen_patch.py: proves
; the generated code compiles. Regenerate with
;   python3 tools/gen_patch.py examples/patch_minimal/patch.json
[env:patch_minimal]
extends = common
build_src_filter = +<buddhabox/> +<../examples/patch_minimal/>

; A generated patch with modulation and triggers: clock-triggered pluck,
; dust-struck resonator with chaotic structure, LFO-swept filtered drone,
; reverb. Regenerate with
;   python3 tools/gen_patch.py examples/patch_demo/patch.json
[env:patch_demo]
extends = common
build_src_filter = +<buddhabox/> +<../examples/patch_demo/>

; A generated patch with hardware: a knob on PA1 sets the pitch, a button
; on PB3 opens a low-pass gate, and the on-board LED (PC13) shows the
; button. The LED needs the engine's overrun LED turned off. Regenerate
; with  python3 tools/gen_patch.py examples/patch_hardware/patch.json
[env:patch_hardware]
extends = common
build_src_filter = +<buddhabox/> +<../examples/patch_hardware/>
build_flags = ${common.build_flags} -D BB_OVERRUN_LED=0

; A generated patch played by code: main.cpp runs a sequencer in loop()
; and sets two Params, `note` and `strike`, which the patch cables to the
; oscillator's pitch and the envelope's trigger. Regenerate with
;   python3 tools/gen_patch.py examples/patch_param/patch.json
[env:patch_param]
extends = common
build_src_filter = +<buddhabox/> +<../examples/patch_param/>
